<!DOCTYPE html>
<html lang="ca" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ProRide 2025-26</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { user-select: none; -webkit-tap-highlight-color: transparent; }
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
    .card-inner { transition: transform 0.35s cubic-bezier(0.34, 1.4, 0.64, 1); }
    .card.flipped .card-inner { transform: rotateY(180deg); }
    @keyframes shakeAnimation {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }
    .shake { animation: shakeAnimation 0.4s ease-in-out; }
  </style>
</head>
<body class="min-h-full flex flex-col justify-between items-center bg-slate-950 text-slate-100 p-2 sm:p-4 font-sans overflow-x-hidden">

  <!-- Header -->
  <header class="w-full max-w-3xl text-center pt-2 pb-1">
    <div class="flex items-center justify-center gap-2">
      <span class="inline-block p-1.5 bg-amber-500/20 text-amber-400 rounded-lg border border-amber-500/30">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
      </span>
      <h1 class="text-xl sm:text-2xl font-black tracking-tight text-white">PRORIDE 2025-26</h1>
    </div>
    <p class="text-xs text-slate-400 mt-1">Troba les 21 parelles! Si falles, es tanca tot el panell però les posicions es mantenen.</p>
  </header>

  <!-- Dashboard / Stats -->
  <div class="w-full max-w-3xl grid grid-cols-4 gap-2 my-2 text-center">
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-2 flex flex-col items-center justify-center">
      <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Temps</span>
      <span id="timer-display" class="text-base sm:text-lg font-extrabold font-mono text-cyan-400">00:00.0</span>
    </div>
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-2 flex flex-col items-center justify-center">
      <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Ràtxa</span>
      <span id="streak-display" class="text-base sm:text-lg font-extrabold text-emerald-400">0/21</span>
    </div>
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-2 flex flex-col items-center justify-center">
      <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Errors</span>
      <span id="resets-display" class="text-base sm:text-lg font-extrabold text-rose-500">0</span>
    </div>
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-2 flex flex-col items-center justify-center">
      <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Rècord</span>
      <span id="best-display" class="text-xs sm:text-sm font-bold text-slate-300">--:--</span>
    </div>
  </div>

  <!-- Status Banner -->
  <div id="status-banner" class="w-full max-w-3xl py-2 px-3 bg-slate-900/90 border border-slate-800 rounded-xl text-center text-xs font-semibold text-slate-300 transition-all duration-300 flex items-center justify-center gap-2 min-h-[36px]">
    <span>Clica una casella per iniciar el cronòmetre</span>
  </div>

  <!-- Game Grid Container -->
  <main class="w-full max-w-3xl my-auto flex items-center justify-center p-2 sm:p-3 bg-slate-900/50 border border-slate-800/80 rounded-2xl shadow-2xl relative">
    <div id="card-grid" class="w-full grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-1.5 sm:gap-2">
    </div>
  </main>

  <!-- Controls Footer -->
  <footer class="w-full max-w-3xl mt-3 mb-1 flex gap-2">
    <button id="btn-restart" class="w-full py-3 px-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-xl shadow-lg shadow-amber-500/20 transition-all text-sm">
      Nova Partida (Barrejar)
    </button>
  </footer>

  <!-- Victory Modal -->
  <div id="victory-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-md text-center shadow-2xl">
      <h2 class="text-2xl font-black text-white mb-1">VICTÒRIA PRORIDE!</h2>
      <p class="text-xs text-slate-400 mb-4">Has trobat les 21 parelles!</p>
      <button id="btn-modal-restart" class="w-full py-3 px-4 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl text-sm">
        Tornar a Jugar
      </button>
    </div>
  </div>

  <script>
    // Noms dels corredors i els seus fitxers d'imatge locals
    const RIDERS = [
      { name: "Òliver Serra", photo: "MiquelM.png" },
      { name: "Martí Collell", photo: "MiquelM.png" },
      { name: "Pau Rodoreda", photo: "MiquelM.png" },
      { name: "Oriol Fornell", photo: "MiquelM.png" },
      { name: "Lluc Bayés", photo: "MiquelM.png" },
      { name: "Martí Miró", photo: "MiquelM.png" },
      { name: "Héctor González", photo: "MiquelM.png" },
      { name: "Pol Ruz", photo: "MiquelM.png" },
      { name: "Axel Serrano", photo: "MiquelM.png },
      { name: "Miquel Martín", photo: "MiquelM.png" },
      { name: "Pau Enrique", photo: "MiquelM.png" },
      { name: "Marc Danti", photo: "MiquelM.png" },
      { name: "Ángel Rojo", photo: "MiquelM.png" },
      { name: "Adrià Vilanova", photo: "MiquelM.png" },
      { name: "Bernat Muñoz", photo: "MiquelM.png" },
      { name: "Eloi Vilaró", photo: "MiquelM.png" },
      { name: "Oriol Barniol", photo: "MiquelM.png" },
      { name: "Roc Andreu", photo: "RocA.png" },
      { name: "Marc Quatrecasas", photo: "MarcQ.png" },
      { name: "Joan Pujol", photo: "JoanP.png" },
      { name: "David López", photo: "DavidL.png" }
    ];

    let cards = [];
    let selectedIndices = [];
    let currentStreak = 0;
    let resetCount = 0;
    let isProcessing = false;

    const cardGrid = document.getElementById('card-grid');
    const streakDisplay = document.getElementById('streak-display');
    const resetsDisplay = document.getElementById('resets-display');

    function initGameSession() {
      currentStreak = 0;
      resetCount = 0;
      selectedIndices = [];
      isProcessing = false;

      streakDisplay.textContent = '0/21';
      resetsDisplay.textContent = '0';

      let rawDeck = [];
      RIDERS.forEach((runner, idx) => {
        rawDeck.push({ runnerId: idx, type: 'name', content: runner.name });
        rawDeck.push({ runnerId: idx, type: 'photo', content: runner.photo });
      });

      cards = shuffleArray(rawDeck).map((item, index) => ({
        ...item,
        gridIndex: index,
        isFlipped: false
      }));

      renderBoard();
    }

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function renderBoard() {
      cardGrid.innerHTML = '';
      
      cards.forEach((card, idx) => {
        const cardContainer = document.createElement('div');
        cardContainer.className = 'card perspective-1000 w-full aspect-[3/4] cursor-pointer';

        cardContainer.innerHTML = `
          <div id="card-inner-${idx}" class="card-inner w-full h-full relative transform-style-3d rounded-lg shadow-md border border-slate-800">
            <div class="card-face backface-hidden absolute inset-0 bg-slate-800 border border-slate-700/60 rounded-lg flex items-center justify-center">
              <span class="text-[8px] sm:text-xs font-black text-slate-500">PRO</span>
            </div>
            <div class="card-face backface-hidden rotate-y-180 absolute inset-0 bg-slate-900 border-2 border-amber-500/80 rounded-lg flex flex-col items-center justify-center p-0.5 text-center overflow-hidden">
              ${card.type === 'photo' 
                ? `<img src="${card.content}" class="w-full h-full object-cover rounded-md" alt="${card.content}" />` 
                : `<span class="text-[8px] sm:text-xs font-extrabold text-slate-100 px-0.5">${card.content}</span>`}
            </div>
          </div>
        `;

        cardContainer.addEventListener('click', () => handleCardClick(idx));
        cardGrid.appendChild(cardContainer);
      });

      // Banner "El millor equip del món"
      const bannerTile = document.createElement('div');
      bannerTile.className = 'col-span-2 w-full aspect-[6/4] sm:aspect-auto sm:h-full bg-amber-500/20 border-2 border-amber-500/40 rounded-lg flex items-center justify-center p-2 text-center';
      bannerTile.innerHTML = `<span class="text-[10px] sm:text-xs font-black text-amber-300 uppercase">El millor equip del món</span>`;
      cardGrid.appendChild(bannerTile);
    }

    function handleCardClick(index) {
      if (isProcessing) return;

      const card = cards[index];
      if (card.isFlipped) return;

      card.isFlipped = true;
      const cardInner = document.getElementById(`card-inner-${index}`);
      cardInner.parentElement.classList.add('flipped');

      selectedIndices.push(index);

      if (selectedIndices.length === 2) {
        checkPair();
      }
    }

    function checkPair() {
      isProcessing = true;
      const idx1 = selectedIndices[0];
      const idx2 = selectedIndices[1];
      const card1 = cards[idx1];
      const card2 = cards[idx2];

      if (card1.runnerId === card2.runnerId) {
        currentStreak++;
        streakDisplay.textContent = `${currentStreak}/21`;
        selectedIndices = [];
        isProcessing = false;

        if (currentStreak === 21) {
          document.getElementById('victory-modal').classList.remove('opacity-0', 'pointer-events-none');
        }
      } else {
        resetCount++;
        resetsDisplay.textContent = resetCount;
        cardGrid.classList.add('shake');

        setTimeout(() => {
          cardGrid.classList.remove('shake');
          cards.forEach((c, i) => {
            c.isFlipped = false;
            const cardInner = document.getElementById(`card-inner-${i}`);
            if (cardInner) {
              cardInner.parentElement.classList.remove('flipped');
            }
          });

          currentStreak = 0;
          streakDisplay.textContent = '0/21';
          selectedIndices = [];
          isProcessing = false;
        }, 850);
      }
    }

    document.getElementById('btn-restart').addEventListener('click', initGameSession);
    document.getElementById('btn-modal-restart').addEventListener('click', () => {
      document.getElementById('victory-modal').classList.add('opacity-0', 'pointer-events-none');
      initGameSession();
    });

    window.onload = initGameSession;
  </script>
</body>
</html>
